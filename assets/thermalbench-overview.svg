<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">ThermalBench progressive generalization scopes</title>
  <desc id="desc">Five scopes progress from fixed-design source suites through layout, material, and boundary variation to case-disjoint structural out-of-distribution systems, all evaluated with one shared protocol.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d35"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1440" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1280" cy="-40" r="280" fill="#6d28d9" opacity="0.10"/>
  <circle cx="80" cy="600" r="330" fill="#0284c7" opacity="0.10"/>

  <text x="64" y="72" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">Progressive physical support</text>
  <text x="64" y="108" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Matched-support prediction</text>
  <line x1="292" y1="101" x2="1058" y2="101" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1090" y="108" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">Structural OOD</text>

  <!-- S1 -->
  <g transform="translate(64 146)" filter="url(#shadow)">
    <rect width="236" height="330" rx="20" fill="#10243a" stroke="#38bdf8" stroke-opacity="0.55"/>
    <rect width="236" height="7" rx="4" fill="#38bdf8"/>
    <text x="24" y="55" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">S1</text>
    <text x="24" y="86" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Source suite</text>
    <text x="24" y="118" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">fixed physical design</text>
    <g transform="translate(24 153)">
      <rect x="0" y="0" width="54" height="54" rx="10" fill="#0ea5e9" opacity="0.2" stroke="#38bdf8"/>
      <path d="M12 17h30v20H12z M17 12v5m10-5v5m10-5v5m-20 20v5m10-5v5m10-5v5M7 21h5m-5 10h5m30-10h5m-5 10h5" fill="none" stroke="#7dd3fc" stroke-width="2"/>
      <text x="72" y="21" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">power + time</text>
      <text x="72" y="45" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">same product</text>
    </g>
    <line x1="24" y1="236" x2="212" y2="236" stroke="#334155"/>
    <text x="24" y="274" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Alpha EV6 + industry</text>
    <text x="24" y="302" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">32k samples</text>
  </g>

  <!-- S2 -->
  <g transform="translate(332 146)" filter="url(#shadow)">
    <rect width="236" height="330" rx="20" fill="#102a2b" stroke="#34d399" stroke-opacity="0.55"/>
    <rect width="236" height="7" rx="4" fill="#34d399"/>
    <text x="24" y="55" fill="#6ee7b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">S2</text>
    <text x="24" y="86" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Layout</text>
    <text x="24" y="118" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">represented systems</text>
    <g transform="translate(24 151)">
      <rect x="2" y="6" width="48" height="35" rx="5" fill="#34d399" opacity="0.80"/>
      <rect x="58" y="0" width="35" height="27" rx="5" fill="#a7f3d0" opacity="0.75"/>
      <rect x="66" y="36" width="28" height="22" rx="5" fill="#6ee7b7" opacity="0.6"/>
      <path d="M112 28h50" stroke="#6ee7b7" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="178" y="5" width="25" height="44" rx="5" fill="#34d399" opacity="0.75"/>
    </g>
    <text x="24" y="225" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">placement · orientation</text>
    <line x1="24" y1="236" x2="212" y2="236" stroke="#334155"/>
    <text x="24" y="274" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Cases 1–10</text>
    <text x="24" y="302" fill="#6ee7b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">15k samples · 3 ch</text>
  </g>

  <!-- S3 -->
  <g transform="translate(600 146)" filter="url(#shadow)">
    <rect width="236" height="330" rx="20" fill="#302614" stroke="#fbbf24" stroke-opacity="0.60"/>
    <rect width="236" height="7" rx="4" fill="#fbbf24"/>
    <text x="24" y="55" fill="#fcd34d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">S3</text>
    <text x="24" y="86" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Material</text>
    <text x="24" y="118" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">S2 + conductivity</text>
    <g transform="translate(24 150)">
      <path d="M4 44L54 18l50 26-50 26z" fill="#fbbf24" opacity="0.50"/>
      <path d="M4 32L54 6l50 26-50 26z" fill="#fde68a" opacity="0.65"/>
      <rect x="134" y="2" width="18" height="58" rx="9" fill="none" stroke="#fcd34d" stroke-width="3"/>
      <circle cx="143" cy="53" r="7" fill="#f59e0b"/>
      <path d="M143 15v34" stroke="#f59e0b" stroke-width="4"/>
      <text x="166" y="39" fill="#fcd34d" font-family="Georgia,serif" font-size="30" font-style="italic">k</text>
    </g>
    <text x="24" y="225" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">local thermal properties</text>
    <line x1="24" y1="236" x2="212" y2="236" stroke="#334155"/>
    <text x="24" y="274" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Cases 1–10</text>
    <text x="24" y="302" fill="#fcd34d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">15k samples · 4 ch</text>
  </g>

  <!-- S4 -->
  <g transform="translate(868 146)" filter="url(#shadow)">
    <rect width="236" height="330" rx="20" fill="#352118" stroke="#fb923c" stroke-opacity="0.62"/>
    <rect width="236" height="7" rx="4" fill="#fb923c"/>
    <text x="24" y="55" fill="#fdba74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">S4</text>
    <text x="24" y="86" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Boundary</text>
    <text x="24" y="118" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">S3 + environment</text>
    <g transform="translate(24 151)">
      <circle cx="40" cy="29" r="22" fill="none" stroke="#fb923c" stroke-width="5"/>
      <path d="M40 2v54M13 29h54M21 10l38 38M59 10L21 48" stroke="#fdba74" stroke-width="2"/>
      <path d="M93 13c21-11 40 5 58-4M93 30c21-11 40 5 58-4M93 47c21-11 40 5 58-4" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
      <text x="169" y="38" fill="#fdba74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Tₐ</text>
    </g>
    <text x="24" y="225" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">ambient · convection</text>
    <line x1="24" y1="236" x2="212" y2="236" stroke="#334155"/>
    <text x="24" y="274" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Cases 1–10</text>
    <text x="24" y="302" fill="#fdba74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">15k samples · 7 ch</text>
  </g>

  <!-- S5 -->
  <g transform="translate(1136 146)" filter="url(#shadow)">
    <rect width="240" height="330" rx="20" fill="#2a1c3f" stroke="#a78bfa" stroke-opacity="0.70"/>
    <rect width="240" height="7" rx="4" fill="#a78bfa"/>
    <text x="24" y="55" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">S5</text>
    <text x="24" y="86" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Structural OOD</text>
    <text x="24" y="118" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">case-disjoint systems</text>
    <g transform="translate(24 147)">
      <rect x="2" y="4" width="76" height="58" rx="10" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 4"/>
      <rect x="12" y="15" width="20" height="16" rx="3" fill="#a78bfa"/>
      <rect x="41" y="37" width="27" height="15" rx="3" fill="#c4b5fd"/>
      <rect x="100" y="4" width="88" height="58" rx="10" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5 4"/>
      <rect x="111" y="15" width="16" height="36" rx="3" fill="#8b5cf6"/>
      <rect x="135" y="15" width="18" height="17" rx="3" fill="#c4b5fd"/>
      <rect x="160" y="36" width="17" height="15" rx="3" fill="#a78bfa"/>
    </g>
    <text x="24" y="225" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">count · size · density</text>
    <line x1="24" y1="236" x2="216" y2="236" stroke="#475569"/>
    <text x="24" y="274" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Cases 16–20</text>
    <text x="24" y="302" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">5k samples · 7 ch</text>
  </g>

  <g transform="translate(64 510)">
    <rect width="1312" height="1" fill="url(#accent)" opacity="0.55"/>
    <text x="0" y="32" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">ONE RELEASE CONTRACT</text>
    <text x="224" y="32" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">fixed splits · supervised labels · shared metrics · 8 baselines · train / test / adapt / report</text>
  </g>
</svg>
